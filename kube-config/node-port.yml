apiVersion: v1
kind: Service
metadata:
  name: short-app-port
spec:
  type: NodePort
  ports:  #  kube-proxy использует диапазон 30000 - 32676
    - port: 3000 # Порт внутри кластера, по которому другие поды могут достучаться до этого пода
      targetPort: 80 # порт пода, для взаимодействия между service nodeport и pod
      nodePort: 31200 # порт для взаимодействия между kube-proxy и service nodeport
  selector:
    components: frontend